[package]
name = "ronnia"
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Twitch to osu! request relay and account API"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
url = "2"
httpdate = "1"
percent-encoding = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"
sentry = { version = "0.49.5", default-features = false, features = ["reqwest", "rustls-no-provider", "contexts", "panic", "backtrace", "metrics"] }
sentry-tracing = { version = "0.49.5", default-features = false }
sentry-tower = { version = "0.49.5", default-features = false, features = ["http"] }
utoipa = { version = "5", features = ["axum_extras"] }
aes-gcm = "0.10"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
