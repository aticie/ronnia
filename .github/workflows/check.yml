name: Rust verification
on:
  # Branch pushes are covered by the pull_request run when a PR is open;
  # listening on every push doubled every run on in-repo branches.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step would otherwise sit on GitHub's 360 minute default and block
    # every queued job; the full job normally finishes in under 10 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: docker/setup-buildx-action@v4
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docker
          tags: ronnia:check
          load: true
          cache-from: type=gha,scope=ronnia-docker
          cache-to: type=gha,scope=ronnia-docker,mode=max,ignore-error=true,timeout=2m
        timeout-minutes: 12
      - name: Smoke-test the packaged binary
        run: |
          container="$(docker create ronnia:check)"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/ronnia" "$RUNNER_TEMP/ronnia"
          python3 scripts/smoke.py --binary "$RUNNER_TEMP/ronnia"
