name: Rust verification
on:
  # Branch pushes are covered by the pull_request run when a PR is open;
  # listening on every push doubled every run on in-repo branches.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step would otherwise sit on GitHub's 360 minute default and block
    # every queued job; the full job normally finishes in under 10 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: python3 scripts/smoke.py --binary target/release/ronnia
      - run: docker build -f Dockerfile.docker -t ronnia:check .
        timeout-minutes: 12
